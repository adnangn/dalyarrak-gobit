<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DALYARRAK GOBİT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="640" height="360"></canvas>
    <div id="controls">
      <button class="ctrl" id="btnLeft" aria-label="Sol">◀</button>
      <button class="ctrl mouth" id="btnMouth" aria-label="Ağız aç">AĞIZ</button>
      <button class="ctrl" id="btnRight" aria-label="Sağ">▶</button>
      <button class="ctrl auto" id="btnAuto" aria-label="Otomatik ağız" aria-pressed="false">OTO</button>
      <button class="ctrl pause" id="btnPause" aria-label="Duraklat">II</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
